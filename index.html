<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00703E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>앵커김군 선단</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="건국대학교 앵커사업단 업무 도구 선단 — 공문김군, 회의김군, 출장김군, 검수김군">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;900&display=swap">
<style>
/* Layout: a fixed low-poly harbor (WebGL) fills the screen; each scroll stop is a logbook page laid over it,
   the camera sails from the home port past every ship to the shipyard. A route chart at the bottom tracks the voyage. */
:root{
  --paper:#F2F5F1;        /* chart paper, green-biased neutral */
  --panel:rgba(250,252,249,.92);
  --ink:#10251C;          /* deep heritage ink */
  --ink-soft:#4C5E55;
  --line:#C9D5CD;
  --ku:#00703E;           /* 헤리티지 그린 (공식 마크 추출값) */
  --ku-deep:#005128;
  --brass:#B8912F;        /* 항해 황동 · 강조 */
  --sea-ink:#2F6E8F;
  --sky-top:#BFD9DC;
  --sky-bottom:#EAF1EA;
  --on-ku:#FFFFFF;
  --food:#B4552F;         /* 보급소 · 감색 */
  --alert:#C2412D;        /* 분쟁 해역 표지 */
  --f-display:"Noto Serif KR", "Nanum Myeongjo", Georgia, serif;
  --f-body:"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0A1813; --panel:rgba(12,29,23,.9); --ink:#E3ECE6; --ink-soft:#9DB2A7; --line:#25463A;
    --ku:#3BAE74; --ku-deep:#2A8A5A; --brass:#D9B25A; --sea-ink:#7FB5CF;
    --sky-top:#040D0B; --sky-bottom:#0F2A27; --on-ku:#04140D; --food:#E58A5F; --alert:#F0745C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0A1813; --panel:rgba(12,29,23,.9); --ink:#E3ECE6; --ink-soft:#9DB2A7; --line:#25463A;
  --ku:#3BAE74; --ku-deep:#2A8A5A; --brass:#D9B25A; --sea-ink:#7FB5CF;
  --sky-top:#040D0B; --sky-bottom:#0F2A27; --on-ku:#04140D; --food:#E58A5F; --alert:#F0745C; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}

/* ---------- scene ---------- */
#sky{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 58%)}
#scene,#mapScene{position:fixed;inset:0;z-index:1;width:100%;height:100%;display:block;touch-action:pan-y}
#mapScene{z-index:2;transition:opacity .1s linear}
#labels{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;
  font:500 11px/1 var(--f-mono);letter-spacing:.04em;white-space:nowrap;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 9px 5px 7px;display:flex;gap:6px;align-items:center;
  transition:opacity .25s}
.tag i{width:8px;height:8px;border-radius:50%;display:block}
.tag b{font:700 12px/1 var(--f-body);letter-spacing:0}
.tag.off{opacity:0;pointer-events:none}
.tag.sea{background:none;border:0;padding:0;cursor:default;pointer-events:none;font:600 15px/1 var(--f-display);letter-spacing:.5em;color:var(--sea-ink);text-shadow:0 1px 0 var(--paper)}
.tag.sea.big{font-size:20px;letter-spacing:.35em}
.tag.sea small{display:block;font:500 9px/1 var(--f-mono);letter-spacing:.3em;margin-top:6px;text-align:center}
.tag.land{background:none;border:0;padding:0;pointer-events:none;font:900 19px/1 var(--f-display);letter-spacing:.3em;color:var(--ku-deep);text-shadow:0 0 6px var(--paper),0 0 2px var(--paper)}
.tag.isle{font-size:10.5px;padding:3px 7px}

/* ---------- header ---------- */
.bar{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:var(--panel);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.depots{flex-basis:100%;display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;padding-top:8px;border-top:1px dashed var(--line);min-width:0}
.depots::-webkit-scrollbar{display:none}
.depots .dl{font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;color:var(--food);white-space:nowrap;display:flex;align-items:center;gap:6px}
.depots .dl::before{content:"";width:8px;height:8px;border:1.5px solid currentColor;transform:rotate(45deg)}
.chip{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 8px;font:500 12.5px/1 var(--f-body);background:var(--paper)}
.chip i{width:8px;height:8px;border-radius:2px;transform:rotate(45deg);flex:none}
.chip small{font:500 10.5px/1 var(--f-mono);color:var(--ink-soft)}
.chip:hover{border-color:var(--food)}
.chip.go{border-style:dashed;color:var(--ink-soft)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand svg{width:30px;height:30px;flex:none;color:var(--ku)}
.brand strong{font:900 18px/1.1 var(--f-display);letter-spacing:-.01em;display:block}
.brand small{font:500 10px/1.2 var(--f-mono);letter-spacing:.14em;color:var(--ink-soft);display:block}
.status{display:flex;gap:14px;margin-left:auto;font:400 11.5px/1 var(--f-mono);color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.status span b{color:var(--ink);font-weight:500}
.btn{font:700 13px/1 var(--f-body);border-radius:var(--r);padding:10px 14px;border:1px solid var(--ku);background:var(--ku);color:var(--on-ku);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ku)}
.btn.small{padding:8px 11px;font-size:12px}
.btn[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#1b1407}
@media (max-width:860px){.status .opt{display:none}}
@media (max-width:560px){.status{display:none}.bar .btn{margin-left:auto}}

/* ---------- voyage stops ---------- */
#voyage{position:relative;z-index:4;pointer-events:none}
.stop{min-height:100vh;min-height:100svh;display:flex;align-items:center;
  padding-block:136px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.log{pointer-events:auto;width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:22px 24px 22px;box-shadow:0 18px 40px -24px rgba(6,30,20,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);margin-left:clamp(0px,4vw,56px)}
.log-head{display:flex;justify-content:space-between;gap:12px;font:500 11px/1.3 var(--f-mono);letter-spacing:.06em;color:var(--ink-soft);
  padding-bottom:10px;margin-bottom:14px;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.log-head .hull{color:var(--brass);font-weight:500}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ku)}
.log h1,.log h2{font-family:var(--f-display);font-weight:900;letter-spacing:-.02em;text-wrap:balance;margin:8px 0 4px}
.log h1{font-size:clamp(34px,5.4vw,52px);line-height:1.08}
.log h2{font-size:clamp(28px,4vw,38px);line-height:1.12}
.log .sub{font-weight:500;color:var(--ink-soft);margin:0 0 12px;font-size:14px}
.log p{margin:0 0 14px;max-width:60ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:16px 0}
.stats div{background:var(--panel);padding:10px 12px;min-width:0}
.stats b{display:block;font:600 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stats span{font:400 11px/1.3 var(--f-mono);color:var(--ink-soft);letter-spacing:.04em}
dl.spec{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 14px;font-size:13.5px}
dl.spec dt{font:500 11px/1.9 var(--f-mono);letter-spacing:.06em;color:var(--ink-soft)}
dl.spec dd{margin:0;min-width:0;overflow-wrap:anywhere}
.pill{display:inline-block;font:500 11px/1 var(--f-mono);padding:4px 7px;border-radius:999px;border:1px solid currentColor;letter-spacing:.04em}
.pill.sail{color:var(--ku)} .pill.build{color:var(--brass)} .pill.depot{color:var(--food)}
.cargo-t{font:500 11px/1 var(--f-mono);letter-spacing:.12em;color:var(--ink-soft);margin:4px 0 8px}
ul.cargo{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:7px;font-size:13.5px}
ul.cargo li{display:grid;grid-template-columns:14px 1fr;gap:8px;line-height:1.5}
ul.cargo li::before{content:"";width:8px;height:8px;margin-top:6px;border:1.5px solid var(--brass);transform:rotate(45deg)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
ol.steps{margin:0 0 16px;padding-left:20px;font-size:13.5px;display:grid;gap:6px}
ol.steps li::marker{font-family:var(--f-mono);color:var(--brass)}
ol.steps.hot li::marker{color:var(--alert)}
.log p.fine{font:400 11px/1.5 var(--f-mono);color:var(--ink-soft);margin:-4px 0 14px}
.tag.hot{border-color:var(--alert);flex-direction:column;align-items:flex-start;gap:3px;padding:6px 10px;border-radius:var(--r)}
.tag.hot b{color:var(--alert);display:flex;align-items:center;gap:6px}
.tag.hot b::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--alert);box-shadow:0 0 0 3px color-mix(in srgb,var(--alert) 25%,transparent)}
.tag.hot small{font:500 9.5px/1 var(--f-mono);letter-spacing:.12em;color:var(--ink-soft)}
@media (max-width:760px){.tag.hot small{display:none}.tag.hot{padding:4px 7px}}
.tag.land.sm{font-size:13px;letter-spacing:.2em;color:var(--ink-soft)}
code,pre{font-family:var(--f-mono);font-size:12px}
pre{background:color-mix(in srgb,var(--ink) 6%,transparent);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;overflow-x:auto;margin:0 0 16px;line-height:1.55}
@media (max-width:760px){
  .stop{align-items:flex-end;padding-block:124px 92px}
  .log{margin:0 auto;padding:18px 18px}
  .log p.long{display:none}
  .stop.hero .log p.long{display:block}
}

/* ---------- route chart ---------- */
.chart{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:var(--panel);border-top:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .35s}
.chart.away{transform:translateY(110%)}
.route{position:relative;display:flex;justify-content:space-between;max-width:880px;margin:0 auto}
.route::before,.route .fill{content:"";position:absolute;left:9px;right:9px;top:9px;height:0;border-top:2px dashed var(--line)}
.route .fill{right:auto;border-top:2px solid var(--ku);width:0}
.route button{position:relative;z-index:1;background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-soft);font:500 11px/1.2 var(--f-mono);min-width:0}
.route button i{width:20px;height:20px;border-radius:50%;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center}
.route button.past i{border-color:var(--ku)}
.route button.on{color:var(--ink)}
.route button.on i{background:var(--ku);border-color:var(--ku)}
.route button.depot i{border-radius:3px;transform:rotate(45deg) scale(.82);border-color:var(--food)}
.route button.depot.on i{background:var(--food);border-color:var(--food)}
.route button.on i::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--paper)}
@media (max-width:560px){.route button span{display:none}.route button.on span{display:block;position:absolute;top:24px;white-space:nowrap}.chart{padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}}

/* ---------- fleet register ---------- */
#fleet{position:relative;z-index:5;background:var(--paper);border-top:1px solid var(--line);
  padding-block:72px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}
#fleet h2{font:900 clamp(28px,4vw,40px)/1.15 var(--f-display);letter-spacing:-.02em;margin:8px 0 6px}
#fleet .lead{color:var(--ink-soft);max-width:62ch;margin:0 0 28px}
.reg-h{display:flex;align-items:center;gap:10px;font:900 20px/1.2 var(--f-display);margin:30px 0 12px}
.reg-h:first-of-type{margin-top:0}
.reg-h span{font:500 11px/1 var(--f-mono);color:var(--ink-soft);letter-spacing:.06em}
.reg-h i{width:10px;height:10px;border-radius:50%;background:var(--ku)}
.reg-h i.d{border-radius:2px;transform:rotate(45deg);background:var(--food)}
.ship.depot{border-color:color-mix(in srgb,var(--food) 45%,var(--line))}
.register{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ship{border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--panel)}
.ship header{display:flex;justify-content:space-between;align-items:center;font:500 11px/1 var(--f-mono);color:var(--ink-soft);letter-spacing:.06em}
.ship h3{font:900 22px/1.2 var(--f-display);margin:0;display:flex;align-items:center;gap:8px}
.ship h3 i{width:10px;height:10px;border-radius:2px;transform:rotate(45deg);flex:none}
.ship .what{font-size:13px;color:var(--ink-soft);margin:0}
.ship .port{margin-top:auto;font:500 12px/1.4 var(--f-mono);color:var(--ku);overflow-wrap:anywhere}
.ship.building{border-style:dashed;background:transparent}
footer.foot{max-width:1040px;margin:48px auto 0;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;font:400 12px/1.6 var(--f-mono);color:var(--ink-soft)}
.no-gl #scene,.no-gl #mapScene,.no-gl #labels{display:none}
</style>

<div id="sky" aria-hidden="true"></div>
<canvas id="scene" aria-label="앵커김군 선단이 정박한 3D 항구"></canvas>
<canvas id="mapScene" aria-label="한반도 전도와 태평양으로 향하는 선단"></canvas>
<div id="labels" aria-hidden="false"></div>

<header class="bar">
  <a class="brand" href="#p1" aria-label="앵커김군 선단 처음으로">
    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="16" cy="5.5" r="2.8"/><path d="M16 8.3V28"/><path d="M10 12.5h12"/>
      <path d="M5 19c0 5 5 9 11 9s11-4 11-9"/><path d="M5 19l-1.8 2.6M5 19l3 .6M27 19l1.8 2.6M27 19l-3 .6"/>
    </svg>
    <span><strong>앵커김군 선단</strong><small>ANCHOR FLEET · KONKUK</small></span>
  </a>
  <div class="status" aria-label="선단 상황">
    <span class="opt">모항 <b>화양동</b> 37.540°N 127.079°E</span>
    <span>KST <b id="clock">--:--:--</b></span>
    <span class="opt" id="fleetCount"></span>
  </div>
  <button class="btn small" id="tour" aria-pressed="false" type="button">자동 항해</button>
  <nav class="depots" id="depotBar" aria-label="보급소 바로가기"></nav>
</header>

<main id="voyage"></main>

<nav class="chart" id="chart" aria-label="항해도">
  <div class="route" id="route"><div class="fill" id="routeFill"></div></div>
</nav>

<section id="fleet" aria-labelledby="fleetTitle">
  <div class="wrap">
    <div class="eyebrow">Fleet register · 선단 명부</div>
    <h2 id="fleetTitle">선단 명부</h2>
    <p class="lead">앵커사업단 업무 도구를 기록합니다. 문서를 만드는 도구는 배로, 업무에 늘 필요한 안내·참고 도구는 선착장 보급소로 둡니다. 보급소는 화면 위쪽에도 고정해 두었습니다.</p>
    <h3 class="reg-h"><i class="d"></i>보급소 <span id="regDepotN"></span></h3>
    <div class="register" id="registerDepot"></div>
    <h3 class="reg-h"><i></i>선박 <span id="regShipN"></span></h3>
    <div class="register" id="register"></div>
  </div>
  <footer class="foot">
    <span>© 2026 건국대학교 앵커사업단 · 앵커김군 · 비공식 업무 지원 도구</span>
    <span>색상 기준: 건국대 UI 매뉴얼 헤리티지 그린 #00703E</span>
  </footer>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   선단 데이터 — 새 배(도구)가 생기면 이 배열에 한 척 추가하면 됩니다.
   status: 'sailing'(취항) | 'building'(건조 중)
   rig:    'galleon'(3돛대 기함) | 'carrack'(2~3돛대) | 'caravel'(삼각돛 쾌속선)
   ===================================================================== */
const FLEET = [
  { hull:'KU-01', name:'공문김군', product:'KU 문서다듬', role:'기함', cls:'갤리온급', rig:'galleon', status:'sailing',
    color:'#00703E', glyph:'文', url:'https://coolzet-ai.github.io/kudocument',
    mission:'공문서 검토·다듬기',
    desc:'기안문을 건국대학교 문서규정, 행정업무운영 편람, 쉬운 공문서 쓰기 길잡이 세 기준으로 나란히 대조하고 고칠 곳을 제안 카드로 보여 줍니다.',
    cargo:['3단 기준 비교와 차이점 해설','주민번호·전화·계좌·학번 가려 보내기','제안 수락·거절 단축키(J/K, A/R)','문서 점수와 표 편집기'] },
  { hull:'KU-02', name:'회의김군', product:'KU 회의록', role:'기록선', cls:'캐랙급', rig:'carrack', status:'sailing',
    color:'#B8912F', glyph:'會', url:'https://coolzet-ai.github.io/kumeet/',

/* ---------- clock ---------- */

const fmt=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
setInterval(()=>{clockEl.textContent=fmt.format(new Date())},1000); clockEl.textContent=fmt.format(new Date());

/* ---------- scroll progress ---------- */
const secs=STOPS.map(s=>document.getElementById(s.id));
const fleetSec=document.getElementById('fleet');
const chart=document.getElementById('chart');
const routeBtns=[...route.querySelectorAll('button')];
const routeFill=document.getElementById('routeFill');
let progress=0, curStop=-1;
function measure(){
  const y=window.scrollY;
  const tops=secs.map(s=>s.offsetTop);
  let p=0;
  for(let i=0;i<tops.length;i++){
    if(i===tops.length-1 || y<tops[i+1]){ const span=(tops[i+1]??tops[i]+1)-tops[i]; p=i+Math.min(1,Math.max(0,(y-tops[i])/span)); if(i===tops.length-1)p=i; break; }
  }
  progress=Math.min(p,STOPS.length-1);
  const near=Math.round(progress);
  if(near!==curStop){
    curStop=near;
    routeBtns.forEach((b,i)=>{b.classList.toggle('on',i===near);b.classList.toggle('past',i<near);b.setAttribute('aria-current',i===near?'step':'false')});
    try{history.replaceState(null,'','#'+STOPS[near].id)}catch(e){}
  }
  const n=STOPS.length-1;
  routeFill.style.width=`calc(${(progress/n)*100}% - ${18*(progress/n)}px)`;
  chart.classList.toggle('away', fleetSec.getBoundingClientRect().top < window.innerHeight*0.6);
}
window.addEventListener('scroll',measure,{passive:true});
window.addEventListener('resize',measure);
function goTo(i){ secs[i]?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); }

/* ---------- auto tour ---------- */
const tourBtn=document.getElementById('tour'); let tourTimer=null;
function stopTour(){ if(!tourTimer)return; clearInterval(tourTimer); tourTimer=null; tourBtn.setAttribute('aria-pressed','false'); tourBtn.textContent='자동 항해'; }
tourBtn.addEventListener('click',()=>{
  if(tourTimer){stopTour();return}
  tourBtn.setAttribute('aria-pressed','true'); tourBtn.textContent='항해 멈추기';
  let i=Math.round(progress); if(i>=STOPS.length-1){i=0;goTo(0)}
  tourTimer=setInterval(()=>{ i++; if(i>=STOPS.length){stopTour();return} goTo(i); },5200);
});
['wheel','touchstart','keydown'].forEach(ev=>window.addEventListener(ev,e=>{ if(e.type==='keydown'&&e.target===tourBtn)return; stopTour(); },{passive:true}));

/* ---------- initial hash ---------- */
const startHash=location.hash.slice(1);
const startIdx=STOPS.findIndex(s=>s.id===startHash);
if(startHash==='fleet') setTimeout(()=>fleetSec.scrollIntoView(),50);
else if(startIdx>0) setTimeout(()=>secs[startIdx].scrollIntoView(),50);

    const gr=g.createLinearGradient(256,0,0,0);gr.addColorStop(0,'rgba(255,255,255,.9)');gr.addColorStop(1,'rgba(255,255,255,0)');
    g.strokeStyle=gr;g.lineWidth=7;g.lineCap='round';g.beginPath();g.moveTo(250,48);g.lineTo(0,8);g.moveTo(250,48);g.lineTo(0,88);g.stroke();
    g.lineWidth=3;g.beginPath();g.moveTo(250,48);g.lineTo(0,48);g.stroke();
    const t=new THREE.CanvasTexture(c);const m=new THREE.Mesh(new THREE.PlaneGeometry(46,16),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false}));
    m.rotation.x=-Math.PI/2;m.position.set(-28,-.6,0);return m}
  const FS=1, fleetG=SAILING.map(s=>{const g=makeShip(s);g.scale.setScalar(FS);g.add(wakeMesh());mS.add(g);return g});
  const FORM=[[0,0],[13,-6],[13,6],[26,0],[26,-12],[26,12]];
  // 지명
  const labelsEl=document.getElementById('labels');
  const mtags=[];
  function mTag(pos,html,cls,stop,grp){const d=document.createElement(stop==null?'div':'button');if(stop!=null){d.type='button';d.addEventListener('click',()=>goTo(stop))}
    d.className='tag '+(cls||'');d.innerHTML=html;labelsEl.appendChild(d);const o={d,pos,grp:grp||'k'};mtags.push(o);return o}
  mTag(proj(127.08,37.54,16),`<i style="background:var(--ku)"></i>모항 <b>건국대</b>`,'',HOME_STOP,'a');
  HOTSPOTS.forEach(h=>mTag(proj(h.lon,h.lat,h.below?0:26),`<b>${esc(h.name)}</b><small>${h.en}</small>`,'hot'+(h.below?' below':''),null,'w'));
  [['이란',54,32.4],['예멘',50.5,16.4],['우크라이나',31.5,49.6],['러시아',45,52],['중국',106,32]].forEach(([n,lo,la])=>mTag(proj(lo,la,8),n,'land sm',null,'w'));
  [['믈라카 해협',100.6,3.2],['수에즈 운하',32.4,30.5],['보스포루스 해협',29.05,41.2]].forEach(([n,lo,la])=>mTag(proj(lo,la,6),n,'isle',null,'w'));
  mTag(proj(127.9,36.75,6),'대한민국','land');
  mTag(proj(131.4,39.2,1),'동 해<small>EAST SEA</small>','sea');
  mTag(proj(124.1,36.2,1),'서 해<small>YELLOW SEA</small>','sea');
  mTag(proj(128.0,33.3,1),'남 해','sea');
  mTag(proj(88,13,1),'인 도 양<small>INDIAN OCEAN</small>','sea big',null,'w');
  mTag(proj(131.87,37.24,0),'<b>독도</b>','isle below');
  mTag(proj(130.87,37.5,5),'울릉도','isle');
  mTag(proj(126.55,33.1,6),'제주도','isle');
  const fleetTag=mTag(new THREE.Vector3(),`<i style="background:var(--brass)"></i>앵커김군 선단 <b>→ 흑해</b>`,'',stopOf(SAILING[0]),'a');
  // 카메라: 한반도 전도 → 유라시아 항해 코스(원거리) → 모항으로 하강
  const wc=proj(77,28.5);
  const MK=[{p:new THREE.Vector3(18,200,182),l:new THREE.Vector3(44,0,-6)},{p:new THREE.Vector3(wc.x,1180,wc.z+980),l:wc.clone()},{p:new THREE.Vector3(home.x-4,30,home.z+30),l:new THREE.Vector3(home.x+1,0,home.z)}];
  const mP=new THREE.Vector3(), mL=new THREE.Vector3(), tmp=new THREE.Vector3();
  function renderMap(){
    const a=mSeaPos.array, ox=mSea.position.x; for(let i=0;i<a.length;i+=3){const x=mSeaBase[i]+ox,z=mSeaBase[i+2]; a[i+1]=.55*Math.sin(.05*x+t*.6)+.4*Math.sin(.07*z-t*.5)}
    mSeaPos.needsUpdate=true;
    ring.scale.setScalar(1+((t*.6)%1)*1.6); ring.material.opacity=.85*(1-((t*.6)%1));
    pinHead.rotation.y=t*.8;
    const pr=Math.min(2,Math.max(0,progress)), wideK=pr<=1?ease(pr):1-ease(pr-1), SK=1+5*wideK;
    hotRings.forEach(h=>{h.rs.forEach((r,q)=>{const c=(t*.45+h.ph+q*.5)%1; r.scale.setScalar((1+c*2.2)*(1+2*wideK)); r.material.opacity=.8*(1-c)}); h.g.children[0].scale.setScalar(1+2.2*wideK)});
    const cyc=(t*.0075)%1, uLead=.004+cyc*.99, fade=Math.min(1,cyc/.02,(1-cyc)/.03);
    fleetG.forEach((g,i)=>{const [back0,lat0]=FORM[i%FORM.length], back=back0*SK, lat=lat0*SK; const u=Math.max(0,uLead-back/cLen);
      const p=curve.getPointAt(u), tg=curve.getTangentAt(u); g.position.set(p.x-tg.z*lat,.5+Math.sin(t*1.4+i)*.25,p.z+tg.x*lat);
      g.rotation.y=Math.atan2(-tg.z,tg.x); g.children[0].rotation.z=Math.sin(t*1.1+i)*.04; g.scale.setScalar(FS*SK*fade);});
    let A,B,f,fa,fb; if(pr<=1){A=MK[0];B=MK[1];f=ease(pr);fa=mapFar;fb=mapFarW}else{A=MK[1];B=MK[2];f=ease(pr-1);fa=mapFarW;fb=1}
    mP.copy(A.p).lerp(B.p,f); mL.copy(A.l).lerp(B.l,f);
    tmp.copy(mP).sub(mL).multiplyScalar(fa*(1-f)+fb*f); mP.copy(mL).add(tmp);
    const sway=pr<=1?1:1-f; mP.z+=Math.sin(t*.07)*10*sway*(1+5*wideK); mP.y+=Math.sin(t*.09)*4*sway*(1+5*wideK);
    dashes.visible=wideK<.35; dashesW.visible=!dashes.visible; mS.fog.near=300+1500*wideK; mS.fog.far=1150+3000*wideK; mapWide=wideK;
    mCam.position.copy(mP); mCam.lookAt(mL); mR.render(mS,mCam);
    fleetTag.pos.copy(fleetG[0].position); fleetTag.pos.y+=22*SK;
  }
  let mapFar=1, mapFarW=1, mapWide=0;

  /* ---- theme ---- */
  let night=0;
  function applyTheme(){
    const P=isDark()?PAL.night:PAL.day; night=P.night;
    scene.fog.color.set(P.fog); seaMat.color.set(P.sea); seaMat.specular.set(P.seaSpec);
    hemi.color.set(P.hemiSky); hemi.groundColor.set(P.hemiGround); hemi.intensity=P.hemi;
    sun.intensity=P.sun; sun.color.set(P.sunColor);
    cloudMat.color.set(night?'#9fb2ba':'#ffffff'); cloudMat.opacity=night?.14:.92;
    gm.color.set(night?'#c8d6cf':'#2a3a33');
    stars.material.opacity=night?.85:0; beam.material.opacity=night?.18:0;
    lamp.material.emissiveIntensity=night?1.6:.4; winMat.emissiveIntensity=night?1.1:0;
    lanterns.forEach(l=>l.material.emissiveIntensity=night?2.2:.2);
    mS.fog.color.set(P.fog); mSeaMat.color.set(night?'#123E47':'#2E8590'); mSeaMat.specular.set(P.seaSpec);
    kMat.color.set(night?'#2F6A49':'#63A26F'); oMat.color.set(night?'#2A3A34':'#B3A987'); mtnMat.color.set(night?'#24503A':'#4F8A5B'); snowMat.color.set(night?'#9FB3A8':'#F3F5EF');
    gratMat.opacity=night?.12:.25; mHemi.color.set(P.hemiSky); mHemi.groundColor.set(P.hemiGround); mHemi.intensity=P.hemi; mSun.intensity=P.sun; mSun.color.set(P.sunColor);
    pinHead.material.emissiveIntensity=night?1.2:.25;
  }
  applyTheme(); mq.addEventListener?.('change',applyTheme);
  new MutationObserver(applyTheme).observe(root,{attributes:true,attributeFilter:['data-theme']});
  document.fonts?.ready.then(()=>{ sails.forEach(drawSail); drawSign(); depots.forEach(D=>D.userData.drawSign()); });

  /* ---- camera keyframes ---- */
  const span=yardX+30;
  const KF=[];
  KF.push({p:new THREE.Vector3(yardX*.4,Math.max(30,span*.17),Math.max(80,span*.47)),l:new THREE.Vector3(yardX*.4,3,-6)});
  depots.forEach(D=>{const p=D.position; KF.push({p:new THREE.Vector3(p.x-15,9.5,p.z+25),l:new THREE.Vector3(p.x+.5,3.4,p.z)})});
  shipPos.forEach((p,i)=>KF.push({p:new THREE.Vector3(p.x-24,11,p.z+33),l:new THREE.Vector3(p.x+1,6.5,p.z)}));
  KF.push({p:new THREE.Vector3(yardPos.x-30,22,yardPos.z+40),l:new THREE.Vector3(yardPos.x,4,yardPos.z+2)});
  const camP=KF[0].p.clone(), camL=KF[0].l.clone(), tP=new THREE.Vector3(), tL=new THREE.Vector3();
  const ease=t=>t*t*(3-2*t);

  /* ---- floating tags ---- */
  const tags=[];
  function addTag(obj,offY,html,stopIdx){const d=document.createElement('button');d.type='button';d.className='tag';d.innerHTML=html;d.addEventListener('click',()=>goTo(stopIdx));labelsEl.appendChild(d);tags.push({d,obj,offY})}
  ships.forEach((g,i)=>addTag(g,18,`<i style="background:${SAILING[i].color}"></i>${SAILING[i].hull} <b>${esc(SAILING[i].name)}</b>`,stopOf(SAILING[i])));
  depots.forEach(D=>addTag(D,10,`<i style="background:var(--food)"></i>보급소 <b>${esc(D.userData.ship.name)}</b>`,stopOf(D.userData.ship)));
  addTag(port,19,`<i style="background:var(--ku)"></i>모항 <b>건국대</b>`,HOME_STOP);
  addTag(yard,24,`<i style="background:var(--brass)"></i>건조 중 <b>${BUILDING.map(b=>b.hull).join('·')||'—'}</b>`,STOPS.length-1);
  const v3=new THREE.Vector3();

  /* ---- click on ships ---- */
  const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
  canvas.addEventListener('click',e=>{
    const r=canvas.getBoundingClientRect(); mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(mouse,camera); const hit=ray.intersectObjects(ships.concat(depots),true)[0];
    if(hit){let o=hit.object;while(o&&!o.userData.ship)o=o.parent; if(o){goTo(stopOf(o.userData.ship))}}
  });

  /* ---- resize with framing offset (card on left / bottom) ---- */
  let W=0,Hh=0;
  function resize(){
    W=window.innerWidth; Hh=window.innerHeight; renderer.setSize(W,Hh,false); camera.aspect=W/Hh;
    camera.fov=W<760?52:42;
    if(W>=760) camera.setViewOffset(W,Hh,-Math.min(W*.2,300),0,W,Hh);
    else camera.setViewOffset(W,Hh,0,Hh*.15,W,Hh);
    camera.updateProjectionMatrix();
    mR.setSize(W,Hh,false); mCam.aspect=W/Hh; mCam.fov=W<760?46:36; mapFar=W<760?1.55:(W/Hh<1.3?1.2:1); mapFarW=W<760?1.75:(W/Hh<1.3?1.35:1);
    if(W>=760) mCam.setViewOffset(W,Hh,-Math.min(W*.17,260),0,W,Hh); else mCam.setViewOffset(W,Hh,0,Hh*.2,W,Hh);
    mCam.updateProjectionMatrix();
  }
  resize(); window.addEventListener('resize',resize);

  /* ---- loop ---- */
  let last=performance.now(), t=0, visible=true;
  document.addEventListener('visibilitychange',()=>{visible=!document.hidden; if(visible){last=performance.now();requestAnimationFrame(loop)}});
  function loop(now){
    if(!visible)return;
    const dt=Math.min(.05,(now-last)/1000); last=now; t+=dt*(reduce?.35:1);
    // sea
    const a=seaPos.array; const ox=sea.position.x;
    for(let i=0;i<a.length;i+=3){a[i+1]=wave(seaBase[i]+ox,seaBase[i+2],t)}
    seaPos.needsUpdate=true;
    // ships bob on the wave
    ships.forEach((g,i)=>{const p=shipPos[i],L=g.userData.L; const h=wave(p.x,p.z,t);
      g.position.y=h*.8+.2; const hf=wave(p.x+L*.4,p.z,t), hb=wave(p.x-L*.4,p.z,t), hl=wave(p.x,p.z+2,t), hr=wave(p.x,p.z-2,t);
      g.children[0].rotation.z=(hf-hb)/L*.9; g.children[0].rotation.x=(hl-hr)*.06;});
    buoys.forEach((b,i)=>{b.position.y=wave(b.position.x,b.position.z,t)+.4;b.rotation.z=Math.sin(t*1.3+i)*.12});
    flags.forEach(f=>{const p=f.flag.geometry.attributes.position,a2=p.array;for(let i=0;i<a2.length;i+=3){const x=f.base[i];a2[i+2]=Math.sin(x*2.6-t*5+f.ph)*.22*x}p.needsUpdate=true});
    jib.rotation.y=Math.sin(t*.25)*.7;
    beamPivot.rotation.y=t*.9;
    clouds.forEach(c=>{c.position.x+=dt*1.2; if(c.position.x>yardX+200)c.position.x=-180});
    gulls.forEach(g=>{const u=g.userData,an=t*u.sp+u.ph;g.position.set(u.cx+Math.cos(an)*u.r,u.h+Math.sin(an*2)*1.2,u.cz+Math.sin(an)*u.r);g.rotation.y=-an;const f=Math.sin(t*9+u.ph)*.5;u.a.rotation.z=f;u.b.rotation.z=-f});
    // camera along voyage
    const hp=Math.max(0,progress-2), i0=Math.floor(hp), i1=Math.min(KF.length-1,i0+1), f=ease(hp-i0);
    tP.copy(KF[i0].p).lerp(KF[i1].p,f); tL.copy(KF[i0].l).lerp(KF[i1].l,f);
    // gentle sway so the scene breathes at rest
    tP.x+=Math.sin(t*.2)*.8; tP.y+=Math.sin(t*.27)*.4;
    const k=reduce?1:1-Math.exp(-dt*3.2); camP.lerp(tP,k); camL.lerp(tL,k);
    camera.position.copy(camP); camera.lookAt(camL);
    const mA=1-ease(Math.min(1,Math.max(0,(progress-1.42)/.36)));
    mapCanvas.style.opacity=mA.toFixed(3); mapCanvas.style.visibility=mA<.005?'hidden':'visible'; canvas.style.visibility=mA>.995?'hidden':'visible';
    if(mA<.995) renderer.render(scene,camera);
    if(mA>.005) renderMap();
    // tags
    const place=(d,v,cam,hide)=>{v.project(cam); const x=(v.x*.5+.5)*W, y=(-v.y*.5+.5)*Hh, off=hide||v.z>1||x<-40||x>W+40||y<118||y>Hh-60;
      d.style.transform=`translate(${x}px,${y}px) translate(-50%,${d.classList.contains('below')?'8px':'-100%'})`; d.classList.toggle('off',off)};
    tags.forEach(tg=>{tg.obj.getWorldPosition(v3); v3.y+=tg.offY; place(tg.d,v3,camera,mA>.5)});
    mtags.forEach(tg=>{v3.copy(tg.pos); place(tg.d,v3,mCam,mA<=.5||(tg.grp==='k'&&mapWide>.45)||(tg.grp==='w'&&(mapWide<.45||(W<760&&!tg.d.classList.contains('hot')))))});
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
